<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tudatosharmonia.pph.hu</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap');

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            padding-top: 100px;
            line-height: 1.6;
            background: linear-gradient(to right, #ecfdf5 0%, #10b981 100%);
            background-attachment: fixed;
            min-height: 100vh;
            text-align: center;
        }

        .text-gradient, h1, h2, .label, .contact-card strong {
            background: linear-gradient(to right, #064e3b 0%, #065f46 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: inline-block;
            color: #064e3b;
            filter: drop-shadow(1px 1px 1px rgba(255, 255, 255, 0.5));
            font-weight: 800;
        }

        /* --- FELSŐ MENÜSÁV --- */
        .navbar {
            background: #ffffff;
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            z-index: 2000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }

        .open-menu-btn {
            background: #059669;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.3s ease, background-color 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .open-menu-btn:hover {
            background: #064e3b;
            transform: scale(1.05);
        }

        /* --- BECSÚSZÓ MENÜ (SIDEBAR) --- */
        .sidebar-drawer {
            position: fixed;
            top: 0;
            left: -360px;
            width: 340px;
            height: 100vh;
            background-color: #064e3b;
            color: white;
            z-index: 3500;
            transition: left 0.3s ease-in-out;
            box-shadow: 5px 0 25px rgba(0,0,0,0.3);
            padding: 30px 20px;
            box-sizing: border-box;
            overflow-y: auto;
            text-align: left;
        }

        .sidebar-drawer.active {
            left: 0;
        }

        .close-btn {
            background: none;
            border: none;
            color: #a7f3d0;
            font-size: 32px;
            position: absolute;
            top: 15px;
            right: 20px;
            cursor: pointer;
            line-height: 1;
        }

        .sidebar-section {
            margin-top: 40px;
        }

        .sidebar-drawer h3 {
            color: #a7f3d0;
            font-size: 1.3rem;
            border-bottom: 2px solid rgba(167, 243, 208, 0.3);
            padding-bottom: 8px;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .main-menu-item {
            display: block;
            background: rgba(255, 255, 255, 0.1);
            color: #a7f3d0;
            font-weight: 700;
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            text-decoration: none;
            border: 1px solid rgba(167, 243, 208, 0.3);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .main-menu-item:hover {
            background: #059669;
            color: #ffffff;
            transform: translateX(5px);
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            z-index: 3000;
            backdrop-filter: blur(2px);
        }

        .overlay.active {
            display: block;
        }

        /* --- TARTALOM ÉS DÍSZELEMEK --- */
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; position: relative; z-index: 10; }
        h1 { font-size: 3.5rem; margin-bottom: 50px; }

        .icons { display: flex; gap: 40px; justify-content: center; flex-wrap: wrap; margin-bottom: 80px; }
        .icon-box { display: flex; flex-direction: column; align-items: center; text-decoration: none; width: 180px; transition: transform 0.3s ease; }
        .icon-box:hover { transform: scale(1.15); }

        .icon {
            width: 110px; height: 110px; border-radius: 50%; background: white;
            padding: 5px; border: 3px solid #a7f3d0; display: flex;
            justify-content: center; align-items: center; overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .icon img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        .label { margin-top: 15px; font-size: 16px; font-weight: 800; }

        .footer { padding: 40px 20px; position: relative; z-index: 50; }
        
        .intro-text, .content-block {
            max-width: 850px; margin: 0 auto; background: white;
            padding: 40px; border-radius: 35px; font-size: 18px;
            text-align: left; border: 4px solid #059669; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
            color: #064e3b;
        }

        .pph-button, .back-btn {
            display: inline-block; background: #059669 !important; color: white !important;
            padding: 15px 35px; border-radius: 15px; font-weight: 700;
            text-decoration: none; margin-top: 25px; text-transform: uppercase;
            transition: transform 0.3s ease; cursor: pointer; border: none;
            -webkit-text-fill-color: white !important;
        }
        .pph-button:hover, .back-btn:hover { transform: scale(1.05); }

        /* KÁRTYA RÁCS (KATEGÓRIA OLDALAKHOZ) */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .sub-card {
            background: white;
            border: 3px solid #a7f3d0;
            border-radius: 20px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            text-align: left;
        }

        .sub-card:hover {
            transform: translateY(-5px);
            border-color: #059669;
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
        }

        .sub-card h3 {
            color: #064e3b;
            margin-top: 0;
            font-size: 1.2rem;
        }

        .contact-card-container { display: flex; gap: 25px; justify-content: center; flex-wrap: wrap; margin-top: 30px; }
        .contact-card {
            padding: 30px; background: white; border-radius: 25px;
            min-width: 280px; text-align: left; border: 3px solid #a7f3d0;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            position: relative;
            z-index: 100;
        }
        
        .contact-link { 
            text-decoration: none !important; font-weight: 700; display: block; margin: 8px 0;
            color: #059669 !important; -webkit-text-fill-color: #059669 !important;
            background: none !important;
            cursor: pointer;
        }
        .contact-link:hover { text-decoration: underline !important; }

        @media (max-width: 768px) {
            .navbar { padding: 15px; }
            .sidebar-drawer { width: 290px; }
        }
    </style>
</head>
<body>

<!-- OLDALRÓL BECSÚSZÓ MENÜSOR -->
<aside class="sidebar-drawer" id="sidebarDrawer">
    <button class="close-btn" onclick="toggleMenu()">&times;</button>
    
    <div class="sidebar-section">
        <h3>Menüpontok</h3>
        
        <!-- KEZDŐLAP LINK -->
        <a href="javascript:void(0)" class="main-menu-item" onclick="navigateTo('home')">🏠 Kezdőlap</a>
        
        <!-- 1. FŐMENÜPONT -->
        <a href="javascript:void(0)" class="main-menu-item" onclick="navigateTo('kepzesek')">Képzések és nyílt előadások</a>

        <!-- 2. FŐMENÜPONT -->
        <a href="javascript:void(0)" class="main-menu-item" onclick="navigateTo('tapasztalatok')">Tapasztalatok</a>

        <!-- 3. FŐMENÜPONT -->
        <a href="javascript:void(0)" class="main-menu-item" onclick="navigateTo('kereseti-lehetoseg')">Kereseti lehetőség</a>
    </div>
</aside>

<!-- SÖTÉTÍTŐ HÁTTÉR -->
<div class="overlay" id="menuOverlay" onclick="toggleMenu()"></div>

<!-- FELSŐ MENÜSÁV -->
<nav class="navbar">
    <button class="open-menu-btn" onclick="toggleMenu()">☰ Menü</button>
    <a href="javascript:void(0)" onclick="navigateTo('home')" style="text-decoration:none;"><strong style="color:#064e3b; font-size:18px;">tudatosharmonia.pph.hu</strong></a>
</nav>

<!-- DINAMIKUS TARTALOMTERÜLET -->
<main id="appContent">
    <!-- Alapértelmezetten a kezdőlap töltődik be JavaScriptből -->
</main>

<script>
    function toggleMenu() {
        document.getElementById('sidebarDrawer').classList.toggle('active');
        document.getElementById('menuOverlay').classList.toggle('active');
    }

    // AZ EGYES ALOLDALAK TARTALMA - TELJES EREDETI SZÖVEGEKKEL
    const pages = {
        // --- KEZDŐLAP (A teljes eredeti tartalom) ---
        'home': `
            <div class="container">
                <section>
                    <h1>Kövess minket!</h1>
                    <div class="icons">
                        <a href="https://www.facebook.com/profile.php?id=61586705157743" target="_blank" class="icon-box">
                            <div class="icon"><img src="facebook.png" alt="Facebook"></div>
                            <div class="label">A lelkek hídja</div>
                        </a>
                        <a href="https://www.facebook.com/profile.php?id=61585896197949" target="_blank" class="icon-box">
                            <div class="icon"><img src="facebook.png" alt="Facebook"></div>
                            <div class="label">Fényspirál</div>
                        </a>
                        <a href="https://www.facebook.com/ignaczne.faluhazi.katalin.pph" target="_blank" class="icon-box">
                            <div class="icon"><img src="facebook.png" alt="Facebook"></div>
                            <div class="label">Ignáczné Faluházi Katalin Pph</div>
                        </a>
                    </div>
                </section>
            </div>

            <div class="footer">
                <section class="content-block" style="margin-bottom: 40px;">
                    <h2>Rólunk</h2>
                    <p>Üdvözlünk az oldalunkon! Mi az Ignácz házaspár vagyunk, és már több éve büszke tagjai a PPH Nyílt Akadémia közösségének. Itt értettük meg, mit jelent a valódi szellemi és lelki fejlődés, és ez az út mutatott rá nekünk, hogyan tudunk mi is érdemben segíteni másoknak.</p>
                    <p>Szeretnéd, ha te is átélhetnéd ezt a pozitív változást? Csatlakozz hozzánk, és örömmel támogatunk téged is a fejlődés útján!</p>
                </section>

                <section class="content-block" style="text-align: center; margin-bottom: 40px;">
                    <h2>Regisztráció & Csatlakozás</h2>
                    <p>A regisztráció megkezdéséhez kattints az alábbi gombra:<br>Fontos tudnod, hogy a regisztráció semmilyen kötelezettséggel nem jár.</p>
                    <a href="http://pph.hu/hu/?vez=141816" target="_blank" class="pph-button">PPH REGISZTRÁCIÓ</a>
                </section>

                <section class="content-block">
                    <h2>Kapcsolat</h2>
                    <p style="font-size: 1.17em; font-weight: bold; margin-top: 20px;">Ha bármilyen kérdésed van, keress minket bizalommal telefonon!<br>Emellett a fent csatolt Facebook oldalakon és profilokon is elérsz minket.</p>
                    <div class="contact-card-container">
                        <div class="contact-card">
                            <strong>Ignáczné Faluházi Katalin</strong>
                            <a href="mailto:kata200304@gmail.com" class="contact-link">kata200304@gmail.com</a>
                            <a href="tel:+36706165845" class="contact-link">06 70 616 5845</a>
                        </div>
                        <div class="contact-card">
                            <strong>Ignácz László</strong>
                            <a href="mailto:ignaczlaci73@gmail.com" class="contact-link">ignaczlaci73@gmail.com</a>
                            <a href="tel:+36706018265" class="contact-link">06 70 601 8265</a>
                        </div>
                    </div>
                </section>
            </div>
        `,

        // --- 1. FŐMENÜPONT: KÉPZÉSEK ÉS NYÍLT ELŐADÁSOK ---
        'kepzesek': `
            <div class="container" style="margin-top: 20px;">
                <div class="content-block">
                    <h2>Képzések és nyílt előadások</h2>
                    <p>Válassz az alábbi témakörök közül a részletes leírás megtekintéséhez:</p>
                    
                    <div class="cards-grid">
                        <div class="sub-card" onclick="navigateTo('kepzesek/nyilt')">
                            <h3>Nyílt előadások</h3>
                            <p>Kattints a részletes leírás elolvasásához.</p>
                        </div>
                        <div class="sub-card" onclick="navigateTo('kepzesek/kepzesek-reszletek')">
                            <h3>Képzések</h3>
                            <p>Kattints a részletes leírás elolvasásához.</p>
                        </div>
                        <div class="sub-card" onclick="navigateTo('kepzesek/szeminarium')">
                            <h3>Vasárnapi Szeminárium</h3>
                            <p>Kattints a részletes leírás elolvasásához.</p>
                        </div>
                    </div>

                    <button class="back-btn" onclick="goBack()">← Vissza a főoldalra</button>
                </div>
            </div>
        `,

        'kepzesek/nyilt': `
            <div class="container" style="margin-top: 20px;">
                <div class="content-block">
                    <h2>Nyílt előadások</h2>
                    <p>Szedlacsik Miklós rendszeresen közvetíti a nyilvános előadásokat, ahol aktuális témákról és fontos életterületekről beszél.</p>
                    <p>Emellett arra próbál rávilágítani, hogyan kellene élniük az embereknek az életüket. Nézd meg az ízelítő anyagokat a csatolt Facebook profilokon vagy Szedlacsik Miklós YouTube csatornáján!</p>
                    <p><b>Mikor vannak az előadások?</b><br>Minden szerdán 18:00-kor és minden vasárnap 16:30-kor kezdődő, díjmentes tudatosságfejlesztő és üzleti bemutató előadásra várunk szeretettel minden kedves érdeklődőt.<br>A regisztrált emberek az előadásokról emlékeztető értesítést kapnak e-mailben.</p>
                    <button class="back-btn" onclick="goBack()">← Vissza</button>
                </div>
            </div>
        `,
        'kepzesek/kepzesek-reszletek': `
            <div class="container" style="margin-top: 20px;">
                <div class="content-block">
                    <h2>Képzések</h2>
                    <p>A képzések a nyílt előadások után következnek: ha az ízelítő alapján úgy érzed, hogy szeretnél mélyebben megismerni a tanításokat, a képzések adják meg ehhez a következő lépést.</p>
                    <p>A részvételhez egy csekély havi összeg befizetése szükséges, amelynél értékben sokkal több tudást kapsz cserébe.</p>
                    <button class="back-btn" onclick="goBack()">← Vissza</button>
                </div>
            </div>
        `,
        'kepzesek/szeminarium': `
            <div class="container" style="margin-top: 20px;">
                <div class="content-block">
                    <h2>Vasárnapi Szeminárium</h2>
                    <p>Havonta egy alkalommal kerül megrendezésre a Vasárnapi Szeminárium, ahol egy képzést élőben tekinthetsz meg.</p>

                    <p>A szeminárium nemcsak a tanulásról szól, hanem a találkozásról is: megismerkedhetsz olyan emberekkel, akik hasonlóan gondolkodnak, mint te. És ha nem is gondolkodtok teljesen ugyanúgy, akkor is tudjátok egymást segíteni, és ajánlani egymásnak hasznos dolgokat. Kiváló alkalom arra, hogy kiszakadj a hétköznapokból, és egy támogató közösség tagjaként fejlődj tovább.</p>
                    <button class="back-btn" onclick="goBack()">← Vissza</button>
                </div>
            </div>
        `,

        // --- 2. FŐMENÜPONT: TAPASZTALATOK ---
        'tapasztalatok': `
            <div class="container" style="margin-top: 20px;">
                <div class="content-block">
                    <h2>Tapasztalatok</h2>
                    <p>Válassz az alábbi tapasztalatok közül a részletes leírás megtekintéséhez:</p>

                    <div class="cards-grid">
                        <div class="sub-card" onclick="navigateTo('tapasztalatok/kozosseg')">
                            <h3>Tapasztalataink a közösséggel</h3>
                            <p>Kattints a részletes leírás elolvasásához.</p>
                        </div>
                        <div class="sub-card" onclick="navigateTo('tapasztalatok/valtozas')">
                            <h3>Saját magunk változása</h3>
                            <p>Kattints a részletes leírás elolvasásához.</p>
                        </div>
                    </div>

                    <button class="back-btn" onclick="goBack()">← Vissza a főoldalra</button>
                </div>
            </div>
        `,

        'tapasztalatok/kozosseg': `
            <div class="container" style="margin-top: 20px;">
                <div class="content-block">
                    <h2>Tapasztalataink a közösséggel</h2>
                    <p>Már több éve vagyunk a PPH Nyílt Akadémia közösségének tagjai. Ez idő alatt egy támogató, őszinte és segítőkész közeget ismertünk meg, ahol az emberek egymás fejlődését is a szívükön viselik.</p>
                    <p>A közösség ereje abban rejlik, hogy nem vagy egyedül: a közös alkalmak, az élő adások és a beszélgetések során mindig találsz valakit, aki segít, vagy akitől tanulhatsz.</p>
                    <button class="back-btn" onclick="goBack()">← Vissza</button>
                </div>
            </div>
        `,
        'tapasztalatok/valtozas': `
            <div class="container" style="margin-top: 20px;">
                <div class="content-block">
                    <h2>Saját magunk változása</h2>
                    <p>A tanultak gyakorlása közben mi magunk is sokat változtunk. Tudatosabban kezeljük az élethelyzeteinket, és jobban megértjük a bennünk és körülöttünk zajló folyamatokat.</p>
                    <p>Ez az út mutatta meg nekünk, mit jelent a valódi szellemi és lelki fejlődés, és ennek köszönhetően tudunk mi is érdemben segíteni másoknak.</p>
                    <button class="back-btn" onclick="goBack()">← Vissza</button>
                </div>
            </div>
        `,

        // --- 3. FŐMENÜPONT: KERESETI LEHETŐSÉG ---
        'kereseti-lehetoseg': `
            <div class="container" style="margin-top: 20px;">
                <div class="content-block">
                    <h2>Hogyan kereshetsz pénzt mások segítésével?</h2>
                    <p>A PPH Nyílt Akadémia nemcsak szellemi és lelki fejlődési lehetőséget biztosít, hanem egy egyedülálló, tisztességes kereseti modellt is kínál azok számára, akik szívesen segítenek másoknak a fejlődés útjára lépni.</p>
                    <p>A közösségépítéssel és a képzések ajánlásával egy olyan független jövedelemforrást építhetsz ki, amely biztonságot és anyagi függetlenséget nyújthat a mindennapokban.</p>
                    <div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 20px; margin-top: 25px;">
                        <iframe src="https://www.youtube.com/embed/d0_tDBcsWTs?si=7sjzBgZDYXJGbqGl" title="YouTube video player" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                    </div>
                    <div style="margin-top: 10px;">
                        <a href="https://www.youtube.com/watch?v=d0_tDBcsWTs" target="_blank" class="pph-button">Megnézem a YouTube-on</a>
                    </div>
                    <button class="back-btn" onclick="goBack()">← Vissza a főoldalra</button>
                </div>
            </div>
        `
    };

    // NAVIGÁCIÓS LOGIKA (HISTORY API)
    let currentRoute = 'home';

    function navigateTo(route) {
        document.getElementById('sidebarDrawer').classList.remove('active');
        document.getElementById('menuOverlay').classList.remove('active');

        renderPage(route);

        try {
            history.pushState({ route: route }, '', `#${route}`);
        } catch (e) { /* a böngésző nem engedi, de az oldal így is működik */ }
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // VISSZA GOMB: mindig egy szinttel feljebb lép (almenü -> főmenü -> főoldal)
    function goBack() {
        let parent = 'home';
        if (currentRoute.indexOf('/') !== -1) {
            parent = currentRoute.substring(0, currentRoute.lastIndexOf('/'));
        }
        navigateTo(parent);
    }

    function renderPage(route) {
        const contentArea = document.getElementById('appContent');
        if (pages[route]) {
            contentArea.innerHTML = pages[route];
            currentRoute = route;
        } else {
            contentArea.innerHTML = pages['home'];
            currentRoute = 'home';
        }
    }

    // BÖNGÉSZŐ VISSZA / ELŐRE GOMBJÁNAK KEZELÉSE
    window.addEventListener('popstate', (event) => {
        if (event.state && event.state.route) {
            renderPage(event.state.route);
        } else {
            renderPage('home');
        }
    });

    // KEZDŐ BETÖLTÉS
    window.addEventListener('DOMContentLoaded', () => {
        const initialRoute = location.hash.replace('#', '');
        if (initialRoute && pages[initialRoute]) {
            renderPage(initialRoute);
        } else {
            renderPage('home');
        }
    });
</script>

</body>
</html>
